org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP 9's built-in Kotlin support drops kapt entirely, and this project
# still relies on kapt for Room/Hilt annotation processing (see CLAUDE.md —
# KSP was deliberately avoided because it lagged the Kotlin version in use
# at project start). Opt back into the classic model: separate
# org.jetbrains.kotlin.android plugin per module, kapt supported normally.
android.builtInKotlin=false
android.newDsl=false
kotlin.code.style=official
